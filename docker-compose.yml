# Odoo 20 Community + Postgres, comunes a todos los proyectos del repo.
# Extra-addons: cada carpeta de addons/ es un módulo (addons/fuertafit, addons/myspoty…).
name: proyectitos

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      RUTINAS_PASSWORD: ${RUTINAS_PASSWORD}
      TZ: Europe/Madrid
    volumes:
      - pgdata:/var/lib/postgresql/data          # volumen de Docker: fuera del repo, no se borra al clonar/limpiar
      - ./postgres/init:/docker-entrypoint-initdb.d:ro  # roles y bases de datos, solo la primera vez
    ports:
      - "127.0.0.1:5432:5432"                    # solo este PC (DBeaver, psql…); los contenedores entran por la red
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      retries: 10
    restart: "no"
    networks: [proyectitos]

  odoo:
    build: .
    image: proyectitos-odoo
    container_name: odoo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8069"               # toda la red local (http://IP-de-este-PC:8000). Solo este PC: "127.0.0.1:8000:8069"
    environment:
      PGPASSWORD: ${ODOO_PASSWORD}                    # rol `odoo` de Postgres (puede crear bases de datos)
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}   # contraseña maestra del gestor (/web/database/manager)
      # fuertafit: solo para migrar desde la web antigua (addons/fuertafit/scripts/migrar_rutinas.py)
      RUTINAS_DATABASE_URL: postgresql://rutinas:${RUTINAS_PASSWORD}@postgres:5432/rutinas
      # fuertafit: entrenador con IA (opcional, de pago; además hay que instalar el SDK, ver Dockerfile)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - odoo-datos:/var/lib/odoo                      # adjuntos (filestore) y sesiones de todas las bases de datos
      - ./odoo.conf:/etc/odoo/odoo.base.conf:ro
      # Todos los módulos de una vez: cada addons/<modulo> con __manifest__.py se carga solo.
      - ./addons:/mnt/extra-addons:ro
    restart: "no"
    networks: [proyectitos]

volumes:
  pgdata:
    name: postgres-datos
  odoo-datos:
    name: odoo-datos

networks:
  proyectitos:
    external: true   # red compartida con otras apps: docker network create proyectitos
