services:
  rutinas:
    build: .
    container_name: fuertafit-rutinas
    user: "1000:1000"
    ports:
      - "8000:8000"             # accesible desde tu red local (http://IP-de-este-PC:8000)
      # Para volver a solo este ordenador: "127.0.0.1:8000:8000"
    env_file:
      - path: .env              # DATABASE_URL (Postgres) y, opcional, ANTHROPIC_API_KEY
        required: true
    restart: unless-stopped
    networks: [proyectitos]

# Red compartida con el contenedor `postgres` (../postgres) y otros proyectos.
networks:
  proyectitos:
    external: true
