; Odoo 20 común (sin secretos). Lo completa odoo-entrypoint.sh con addons_path (addons/<proyecto>) y la contraseña maestra.
; La contraseña de Postgres llega por PGPASSWORD desde ~/servicios/.env. Tras cambiar este archivo: docker restart odoo
[options]
data_dir = /var/lib/odoo
db_host = postgres
db_port = 5432
db_user = odoo
; Escuchar en todas las interfaces del contenedor (Odoo 20 usa 127.0.0.1 por defecto); el puerto lo publica ~/servicios/odoo/compose.yml.
http_interface = 0.0.0.0
; Varias bases de datos: selector en /web/login y gestor en /web/database/manager (crear, copiar, copia de
; seguridad, restaurar, borrar), protegido con la contraseña maestra.
list_db = True
; Detrás de `tailscale serve` (HTTPS en https://<este-pc>.<red>.ts.net): fiarse de X-Forwarded-* para generar bien
; las URLs. Odoo 20 necesita HTTPS (contexto seguro) fuera de localhost o el backend se queda en blanco.
proxy_mode = True
workers = 0
max_cron_threads = 1
